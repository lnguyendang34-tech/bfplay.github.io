<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Shop Cày Thuê Blox Fruits</title>
<style>
  /* Nền gradient chuyển màu */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #9333ea);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: white;
    text-align: center;
    padding-top: 50px;
    overflow: hidden;
    position: relative;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  /* Hạt bay */
  .particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    to {
      transform: translateY(-120vh);
      opacity: 0;
    }
  }
  
  /* Box form */
  .box {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    margin: auto;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 0 20px #9333ea;
    position: relative;
    z-index: 10;
  }
  
  /* Input và select */
  input, select {
    padding: 10px;
    width: 80%;
    margin: 8px;
    border-radius: 8px;
    border: none;
  }
  
  /* Button */
  button {
    padding: 10px 20px;
    background: linear-gradient(45deg, #22c55e, #4ade80);
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    transform: scale(1.1);
    background: linear-gradient(45deg, #16a34a, #22c55e);
  }
  
  h1 {
    font-size: 32px;
    margin-bottom: 20px;
    position: relative;
    z-index: 10;
  }
</style>
</head>
<body>

<h1>🔥 Shop Cày Thuê Blox Fruits 🔥</h1>

<div class="box">
  <input id="name" placeholder="Tên của bạn" /><br />
  <input id="acc" placeholder="số điện thoại của bạn" /><br />
  <select id="service">
    <option value="">-- Chọn dịch vụ --</option>
    <option value="Cày Level">Cày Level</option>
    <option value="Farm Beli">Farm Beli</option>
    <option value="Farm Fragment">Farm Fragment</option>
    <option value="Cày V2/V3/V4">Cày V2/V3/V4</option>
     <option value="up tộc v4">Up tộc V4</option>
     <option value="trái ác quỷ rương">trái ác quỷ rương</option>
     <option value="trái ác quỷ vĩnh viễn">trái ác quỷ vĩnh viễn</option>
     <option value="robux">robux</option>
  </select><br />
  <input id="quantity" type="number" min="1" placeholder="Số lượng" /><br />
    <button onclick="order()">Gửi đơn</button>
</div>

<script>
  // Tạo hạt bay random
  function createParticle() {
    const p = document.createElement("div");
    p.classList.add("particle");
    const size = Math.random() * 6 + 4; // 4-10px
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.bottom = "-10px";
    p.style.animationDuration = (Math.random() * 8 + 7) + "s";
    document.body.appendChild(p);
    // Xóa hạt khi kết thúc animation
    p.addEventListener("animationend", () => p.remove());
  }
  // Tạo liên tục hạt bay
  setInterval(createParticle, 300);

  // Xử lý gửi đơn
  function order() {
    let name = document.getElementById("name").value.trim();
    let acc = document.getElementById("acc").value.trim();
    let service = document.getElementById("service").value;

    if (!name || !acc || !service) {
      alert("Vui lòng nhập đầy đủ thông tin!");
      return;
    }

    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    orders.push({ name, acc, service });
    localStorage.setItem("orders", JSON.stringify(orders));
    alert("Đã gửi đơn! Cảm ơn bạn ❤️");

    // Reset form
    document.getElementById("name").value = "";
    document.getElementById("acc").value = "";
    document.getElementById("service").value = "";
  }
</script>

</body>
</html>
